<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ronsel — Desktop Dark</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;display:flex;align-items:flex-start;justify-content:flex-start;min-height:100vh}
.window{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:0 2px 40px rgba(0,0,0,0.25),0 0 0 1px rgba(0,0,0,0.15)}
.titlebar{display:flex;align-items:center;padding:0.625rem 0.875rem;background:#2d2d38;gap:0.375rem;border-bottom:1px solid #3a3a45}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot.red{background:#ff5f57}.dot.yellow{background:#febc2e}.dot.green{background:#28c840}
.title{font-size:0.6875rem;color:#98989d;margin-left:0.375rem;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.content{padding:0;line-height:0}
.content img{display:block;max-width:100%;height:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
    <span class="title">Ronsel — Dashboard</span>
  </div>
  <div class="content"><img src="app-desktop-dark.png" alt="Ronsel Dashboard" draggable="false"></div>
</div>
</body>
</html>
