<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ronsel</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#f5f3ff 0%,#fdf4ff 50%,#fff 100%);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.composite{display:flex;align-items:center;gap:2rem}
.device{display:flex;flex-direction:column}
.window{border-radius:7px;overflow:hidden;box-shadow:0 2px 24px rgba(0,0,0,0.12),0 0 0 1px rgba(0,0,0,0.05)}
.titlebar{display:flex;align-items:center;padding:0.375rem 0.625rem;background:#e8e8ed;gap:0.25rem;border-bottom:1px solid #d1d1d6}
.dot{width:9px;height:9px;border-radius:50%}.dot.red{background:#ff5f57}.dot.yellow{background:#febc2e}.dot.green{background:#28c840}
.title{font-size:0.5625rem;color:#8e8e93;margin-left:0.25rem}
.window img{display:block;width:420px;height:auto}
.phone{background:#0a0a0b;border-radius:28px;padding:8px;box-shadow:0 0 0 1.5px #1c1c1e,0 0 0 4px #2c2c2e,0 0 0 5px #3a3a3c,0 12px 36px rgba(0,0,0,0.2)}
.phone-screen{border-radius:22px;overflow:hidden;position:relative;line-height:0;background:#fff}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:72px;height:18px;background:#0a0a0b;border-radius:0 0 10px 10px;z-index:10}
.phone-screen img{display:block;width:195px;height:auto}
.phone-home{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:90px;height:4px;background:rgba(0,0,0,0.12);border-radius:9999px;z-index:10}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="composite">
<div class="device"><div class="window"><div class="titlebar"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div><span class="title">Ronsel — Dashboard</span></div><img src="app-desktop.png" alt="Desktop" draggable="false"></div></div>
<div class="phone"><div class="phone-screen"><div class="phone-notch"></div><img src="app-mobile.png" alt="Mobile" draggable="false"><div class="phone-home"></div></div></div>
</div></body></html>
